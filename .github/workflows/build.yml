name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  actions: read

jobs:
  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm test

  test-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: updater
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./...
      - run: go test -race ./...

  build-installer:
    needs: [test-node, test-go]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: 'linux'
          - os: macos-latest
            targets: 'mac'
          - os: windows-latest
            targets: 'win'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build:installer
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.targets }}
          path: |
            packages/installer/release/*.exe
            packages/installer/release/*.dmg
            packages/installer/release/*.deb
            packages/installer/release/*.AppImage

  build-config-server:
    needs: [test-node, test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build:config
      - uses: actions/upload-artifact@v4
        with:
          name: config-server
          path: packages/config-server/.output/

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    needs: [build-installer, build-config-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Package config-server artifact
        run: |
          tar -czf artifacts/config-server.tar.gz -C artifacts/config-server .
      - name: Create nightly tag
        if: github.ref == 'refs/heads/master'
        run: |
          git tag -f nightly
          git push -f origin nightly
      - name: Cleanup previous nightly assets
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view nightly >/dev/null 2>&1; then
            gh release view nightly --json assets --jq '.assets[].name' | while read -r name; do
              gh release delete-asset nightly "$name" --yes
            done
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Nightly Build' }}
          prerelease: ${{ github.ref == 'refs/heads/master' }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            artifacts/installer-linux/*.deb
            artifacts/installer-linux/*.AppImage
            artifacts/installer-mac/*.dmg
            artifacts/installer-win/*.exe
            artifacts/config-server.tar.gz
