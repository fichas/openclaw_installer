name: Build and Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 添加权限配置
permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run tests
        run: |
          cd installer
          go test -v -race ./...

  # 构建命令行安装器 (所有平台)
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd installer
          output_name="openclaw-installer-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            output_name="${output_name}.exe"
          fi
          VERSION="${GITHUB_SHA::7}"
          go build -ldflags "-s -w -X main.Version=$VERSION" -o "../dist/${output_name}"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/openclaw-installer-*

  # 打包发布
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installer-*
      - name: Create package
        run: |
          mkdir -p package/OpenClaw/{windows,macos,linux,shared}

          # Windows
          cp artifacts/installer-windows-amd64/openclaw-installer-windows-amd64.exe package/OpenClaw/windows/OpenClaw-Installer.exe
          cp artifacts/installer-windows-arm64/openclaw-installer-windows-arm64.exe package/OpenClaw/windows/ 2>/dev/null || true
          cp usb-template/install.bat package/OpenClaw/windows/
          cp usb-template/install.ps1 package/OpenClaw/windows/

          # macOS
          cp artifacts/installer-darwin-amd64/openclaw-installer-darwin-amd64 package/OpenClaw/macos/OpenClaw-Installer
          cp artifacts/installer-darwin-arm64/openclaw-installer-darwin-arm64 package/OpenClaw/macos/ 2>/dev/null || true
          cp usb-template/install-mac.command package/OpenClaw/macos/

          # Linux
          cp artifacts/installer-linux-amd64/openclaw-installer-linux-amd64 package/OpenClaw/linux/OpenClaw-Installer
          cp artifacts/installer-linux-arm64/openclaw-installer-linux-arm64 package/OpenClaw/linux/ 2>/dev/null || true
          cp usb-template/install-linux.sh package/OpenClaw/linux/

          # Shared
          cp -r adapters package/OpenClaw/shared/
          cp usb-template/README.txt package/OpenClaw/
          echo "${GITHUB_SHA::7}" > package/OpenClaw/VERSION.txt

          # Create ZIP
          cd package
          zip -r ../OpenClaw-Package.zip OpenClaw/
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Complete-Package
          path: OpenClaw-Package.zip

  # 创建 Release (仅在有 tag 时)
  release:
    needs: [build, package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/installer-*/openclaw-installer-*
            artifacts/OpenClaw-Complete-Package/OpenClaw-Package.zip
          generate_release_notes: true
