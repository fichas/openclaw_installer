name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run tests
        run: |
          cd installer
          go test -v -race ./...

  # 构建命令行安装器 (所有平台)
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd installer
          output_name="openclaw-installer-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            output_name="${output_name}.exe"
          fi
          go build -ldflags "-s -w -X main.Version=${{ github.ref_name }}" -o "../dist/${output_name}"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/openclaw-installer-*

  # 创建发布
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release package
        run: |
          mkdir -p release/OpenClaw/{windows,macos,linux,shared}

          # Windows
          cp artifacts/installer-windows-amd64/openclaw-installer-windows-amd64.exe release/OpenClaw/windows/OpenClaw-Installer.exe
          cp artifacts/installer-windows-arm64/openclaw-installer-windows-arm64.exe release/OpenClaw/windows/ 2>/dev/null || true
          cp usb-template/install.bat release/OpenClaw/windows/
          cp usb-template/install.ps1 release/OpenClaw/windows/

          # macOS
          cp artifacts/installer-darwin-amd64/openclaw-installer-darwin-amd64 release/OpenClaw/macos/OpenClaw-Installer
          cp artifacts/installer-darwin-arm64/openclaw-installer-darwin-arm64 release/OpenClaw/macos/ 2>/dev/null || true
          cp usb-template/install-mac.command release/OpenClaw/macos/

          # Linux
          cp artifacts/installer-linux-amd64/openclaw-installer-linux-amd64 release/OpenClaw/linux/OpenClaw-Installer
          cp artifacts/installer-linux-arm64/openclaw-installer-linux-arm64 release/OpenClaw/linux/ 2>/dev/null || true
          cp usb-template/install-linux.sh release/OpenClaw/linux/

          # Shared
          cp -r adapters release/OpenClaw/shared/
          cp usb-template/README.txt release/OpenClaw/
          echo "${{ github.ref_name }}" > release/OpenClaw/VERSION.txt

          # Create ZIP
          cd release
          zip -r OpenClaw-${{ github.ref_name }}.zip OpenClaw/
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/openclaw-installer-*
            release/OpenClaw-*.zip
          generate_release_notes: true
